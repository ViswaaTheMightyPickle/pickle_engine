[workspace]
members = [
    "crates/engine_core",
    "crates/engine_physics",
    "crates/engine_assets",
    "crates/engine_app",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
rapier2d = "=0.36.1"
eframe = "=0.36.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
